---
"on":
  workflow_call:
    inputs:
      jobs_run_on:
        default: ubuntu-latest
        description: The runner group on which jobs will run.
        required: false
        type: string
      terraform_version:
        default: "1.12.2"
        description: The version of Terraform to use when validating.
        required: false
        type: string
      terragrunt_directory:
        default: prod
        description: The environment directory from which Terragrunt should run.
        required: false
        type: string
      timeout_minutes:
        description: The maximum time (in minutes) for a job to run.
        default: 5
        required: false
        type: number
      use_terragrunt:
        default: false
        description: If set to true, use Terragrunt instead of Terraform.
        required: false
        type: boolean
      working_directory:
        description: The working directory where all jobs should be executed.
        default: .
        required: false
        type: string

jobs:
  terraform-validation:
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    if: ${{ inputs.use_terragrunt == false }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ${{ inputs.jobs_run_on }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Install dependencies
        uses: jdx/mise-action@v4
      # Check if mise actually activated a terraform version
      - name: Check for Terraform via mise
        id: check-terraform
        run: |
          # mise where returns a 0 exit code if the tool is configured, or an error if not
          if mise where terraform >/dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Terraform found via mise config."
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No mise/asdf/tfenv config found for Terraform."
          fi
      - name: Setup Terraform
        if: ${{ steps.check-terraform.outputs.found != 'true' }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
      - name: Initialize Terraform
        run: terraform init -reconfigure -backend=false
      - name: Validate Terraform
        run: terraform validate
    timeout-minutes: ${{ inputs.timeout_minutes }}
  terragrunt-validation:
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      DISABLE_INIT: true
    if: ${{ inputs.use_terragrunt == true }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ${{ inputs.jobs_run_on }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Check terragrunt HCL
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_dir: ${{ inputs.working_directory }}
          tg_command: hcl format --check --diff
      - name: Initialize Terraform
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_dir:
            "${{ inputs.working_directory }}/${{ inputs.terragrunt_directory }}"
          tg_command: init
      - name: Validate Terraform
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_dir:
            "${{ inputs.working_directory }}/${{ inputs.terragrunt_directory }}"
          tg_command: validate
    timeout-minutes: ${{ inputs.timeout_minutes }}
